name: 작업 이슈
description: docs/rule/issue-management.md 템플릿 필수 항목 (배경/목적, 요구사항, 완료 조건, 관련 이슈)
title: "[type/scope] "
body:
  - type: markdown
    attributes:
      value: |
        작업 단위 이슈를 등록합니다. 생성 후 아래에서 고른 type/scope에 맞는 라벨(`feat`/`fix`/.../`web`/`api`)을 직접 붙여주세요 — 자동 라벨링은 아직 없습니다 (`docs/rule/issue-management.md` 참조).

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: docs/rule/git-convention.md 커밋 타입과 동일한 기준으로 선택합니다.
      options:
        - feat
        - fix
        - refactor
        - perf
        - test
        - docs
        - chore
        - ci
        - style
        - revert
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: 이 작업이 속하는 패키지를 선택합니다.
      options:
        - web
        - api
        - 공통/여러 패키지
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경/목적
      description: >-
        이 작업이 왜 필요한지 설명합니다. 어떤 문제·요청·의사결정에서 비롯됐는지,
        지금 하지 않으면 무엇이 곤란한지를 씁니다.
      placeholder: |
        예) 관리자 화면에서 주문 취소 시 환불 금액을 수기로 계산하고 있어 오류가 잦음.
        자동 계산 로직이 필요함.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 요구사항
      description: 무엇을 만들어야 하는지 구체적으로 나열합니다.
      placeholder: |
        - 환불 사유별 계산 규칙 A/B/C 적용
        - 계산 결과를 주문 상세 화면에 노출
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      description: 이 조건이 전부 체크되면 이슈를 닫을 수 있는 수준으로, 검증 가능한 항목으로 작성합니다.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위 / 리스크
      description: >-
        이 작업이 건드리는 화면·API·데이터, 그리고 기존 기능에 미칠 수 있는 영향이나
        주의할 점이 있다면 씁니다. 해당 없으면 "없음"이라고 씁니다.
    validations:
      required: false

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 관련 스크린샷, 디자인 링크, 논의 스레드 등이 있다면 첨부합니다.
    validations:
      required: false

  - type: input
    id: related
    attributes:
      label: 관련 이슈 (있다면)
      placeholder: "#12"
    validations:
      required: false

  - type: checkboxes
    id: precheck
    attributes:
      label: 등록 전 확인
      options:
        - label: 중복되거나 이미 진행 중인 이슈가 없는지 확인했습니다.
          required: true
        - label: docs/rule/ 컨벤션 문서를 확인했습니다.
          required: true
