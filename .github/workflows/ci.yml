name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            api:
              - 'apps/api/**'
            shared:
              - 'docker-compose.yml'
              - '.github/workflows/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x ./gradlew
      - run: ./gradlew ktlintCheck build --no-daemon

  # 브랜치 보호 규칙의 required status check는 이 job(워크플로우 전체 집계) 하나만 대상으로 건다.
  # web/api job은 paths-filter로 스킵될 수 있는데, 개별 job을 required로 걸면 스킵된 PR에서
  # 체크가 "대기 중"으로 영원히 남는다 (docs/rule/ci-convention.md 참조). 이 job은 always() 실행이라
  # web/api가 스킵되든 실행되든 항상 결과를 낸다.
  ci:
    name: CI
    needs: [changes, web, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.web.result }}" = "failure" ] || [ "${{ needs.api.result }}" = "failure" ]; then
            echo "web or api job failed"
            exit 1
          fi
